[project]
name = "konferenz-optimizer"
version = "0.1.0"
description = "Optimiert Konferenzzeitplaene (Fach-/Zeugniskonferenzen)"
requires-python = ">=3.10"
dependencies = ["ortools>=9.9"]

[project.scripts]
konferenz-optimizer = "konferenz_optimizer.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["konferenz_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
